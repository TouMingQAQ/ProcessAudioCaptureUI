<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音频小球</title>
  </head>
  <body class="ball-body">
    <div id="stage" class="stage">
      <section id="panel" class="panel" aria-hidden="true">
        <div class="panel-inner">
          <div class="panel-head">
            <span class="kicker" data-i18n="ballWindow.kicker">♫ 正在监听</span>
            <button
              id="btn-lock"
              class="mini-btn"
              type="button"
              data-i18n="ballWindow.lock"
              data-i18n-title="ballWindow.lockTitle"
            >
              锁定
            </button>
            <button id="btn-main" class="mini-btn" type="button" data-i18n="ballWindow.openMain">
              打开主界面
            </button>
          </div>

          <div class="now">
            <div id="now-title" class="now-title" data-i18n="ballWindow.idleTitle">
              还没有开始采集
            </div>
            <div id="now-name" class="now-name" data-i18n="ballWindow.idleSub">
              点下方按钮，小球会自动挑一个正在出声的窗口
            </div>
          </div>

          <!-- 帧数不再展示，这里只留状态 -->
          <div class="meta-row">
            <span id="now-state" class="chip" data-i18n="ballWindow.idleState">待机中</span>
          </div>

          <div class="meter-row">
            <span class="meter-label" data-i18n="ballWindow.volume">音量</span>
            <div class="meter-track"><i id="meter-fill" class="meter-fill"></i></div>
            <span id="meter-text" class="mono meter-num">-∞</span>
          </div>

          <div id="candidate" class="candidate is-off">
            <span class="candidate-dot"></span>
            <span id="candidate-text" class="candidate-text"></span>
          </div>

          <div class="actions">
            <button id="btn-capture" class="pill-btn pill-primary" type="button">开始采集</button>
            <button id="btn-follow" class="pill-btn toggle-btn" type="button" aria-pressed="false">
              <span class="toggle-dot"></span>
              <span data-i18n="ballWindow.follow">自动跟随</span>
            </button>
          </div>

          <p id="hint" class="hint" data-i18n="follow.chip">
            自动跟随：当前窗口安静下来、别的窗口开始出声时，会自动切过去
          </p>
        </div>
      </section>

      <button id="orb" class="orb" type="button" aria-label="音频小球">
        <canvas id="orb-canvas"></canvas>
        <span class="orb-glyph">♪</span>
      </button>
    </div>

    <script type="module" src="/src/ball.ts"></script>
  </body>
</html>
