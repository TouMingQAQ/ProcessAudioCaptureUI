[package]
name = "process-audio-capture-ui"
version = "0.0.4"
description = "进程音频监听：挑一个正在出声的程序，实时看它的波形与频谱"
authors = ["ProcessAudioCaptrueUI"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "process_audio_capture_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 宿主只做展示：窗口枚举 / WASAPI 会话 / SMTC 媒体信息 / DSP 全部由采集内核
# （ProcessAudioCapture.dll）提供，所以这里不再依赖 windows crate，也不需要 FFT 库。
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
# 单实例：第二个进程启动时会立刻退出，并把第一个实例的主窗口叫到前台
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
